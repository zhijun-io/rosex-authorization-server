<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Rosex Authorization Server Sample</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 48rem; }
        pre { background: #f4f4f5; padding: 1rem; overflow: auto; }
        a.button { display: inline-block; padding: 0.5rem 1rem; background: #18181b; color: #fff; text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>
<h1>Rosex Authorization Server Sample</h1>
<p>OAuth2 / OIDC client demo. Start the Authorization Server on port 9000 first.</p>

<div th:if="${!authenticated}">
    <p><a class="button" th:href="@{/oauth2/authorization/rosex-authorization-server}">Sign in</a></p>
</div>

<div th:if="${authenticated}">
    <p>Signed in as <strong th:text="${name}">user</strong>
        <span th:if="${email}">(<span th:text="${email}">email</span>)</span></p>
    <p><a th:href="@{/logout}">Sign out</a></p>
    <h2>ID Token claims</h2>
    <pre th:text="${claims}">{}</pre>
</div>
</body>
</html>
