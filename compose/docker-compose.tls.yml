# HTTPS Authorization Server. Generate certs first:
#   ./scripts/generate-tls-certs.sh
services:
  authorization-server:
    image: ghcr.io/zhijun-io/rosex-authorization-server:latest
    ports:
      - "9000:9000"
    volumes:
      - ../samples/config.yml:/config/config.yml:ro
      - ../samples/tls/application-tls.compose.yml:/config/tls.yml:ro
      - ../samples/tls/certs/server.crt:/certs/server.crt:ro
      - ../samples/tls/certs/server.key:/certs/server.key:ro
    command:
      - --config=/config/config.yml
      - --spring.config.additional-location=optional:file:/config/tls.yml
