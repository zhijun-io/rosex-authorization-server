spring:
  security:
    oauth2:
      client:
        registration:
          rosex-authorization-server:
            client-id: default-client-id
            client-secret: default-client-secret
            client-name: Rosex Authorization Server
            scope:
              - openid
              - email
              - profile
        provider:
          rosex-authorization-server:
            issuer-uri: http://localhost:9000


logging:
  level:
    org.springframework.security: trace
